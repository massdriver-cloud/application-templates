schema: draft-07
name: "{{ name }}"
description: "{{ description }}"
version: "1.0.0"

steps:
  - path: chart
    provisioner: helm

# JSON Schema sans-fields above
{%- if paramsSchema.size > 0 %}
{{ paramsSchema }}
{% else %}
params:
  properties: {}
  # # Examples will show up as configuration presets in the UI _and_ they will be used to test configurations of the bundle.
  # examples:
  #   - __name: Development
  #     foo: bar
  #   - __name: Production
  #     foo: foo
  # required:
  #   - foo
  # properties:
  #   foo:
  #     type: string
  #     title: Foo
  #     description: Name of {{ name }}
  #     default: ""
  #     examples:
  #       - US-West 2 VPC
  #       - US-East 1 VPC
{% endif %}

# Named list of input connections (artifacts) (map[name]artifact)
connections:
  required:
    - kubernetes_cluster
  {%- for conn in connections %}
    - {{ conn.name -}}
  {% endfor %}
  properties:
    kubernetes_cluster:
      $ref: massdriver/kubernetes-cluster
  {%- for conn in connections %}
    {{ conn.name }}:
      $ref: {{ conn.artifact_definition -}}
  {% endfor %}


# Named list of output artifacts  (map[name]artifact)
artifacts:
{%- if artifacts.size > 0 %}
  required:
  {%- for art in artifacts %}
  - {{ art.name -}}
  {% endfor %}
  properties:
  {%- for art in artifacts %}
    {{ art.name }}:
      $ref: {{ art.artifact_definition -}}
  {% endfor %}
{% else %}
  properties: {}
{% endif %}

# List of form customizations for params-schema
# learn more about widgets & fields: https://docs.massdriver.cloud/bundles/custom-widgets-and-fields
ui:
  ui:order:
    - "*"
